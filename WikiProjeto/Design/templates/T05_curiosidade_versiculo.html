<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!--
  TEMPLATE T05 — CURIOSIDADE OU VERSÍCULO (v4 Redesenhado)
  Formato: SQ 1080×1080  |  Estilo: Data Visualization / Infographic
  Modo CURIOSIDADE: barras de dados + stats de impacto
  Modo VERSÍCULO: card editorial com versículo em destaque

  SLOTS (Modo CURIOSIDADE):
    {{CURIOSIDADE_TITLE}}
    {{CURIOSIDADE_BODY}}
    {{STAT_LABEL_1}} / {{STAT_VALUE_1}}
    {{STAT_LABEL_2}} / {{STAT_VALUE_2}}
    {{STAT_LABEL_3}} / {{STAT_VALUE_3}}
    {{STAT_BAR_WIDTH_1/2/3}} (0-100, para barra visual)

  SLOTS (Modo VERSÍCULO):
    {{VERSO_GREEK}}
    {{VERSO_TRADUCAO}}
    {{VERSO_REF}}
    {{VERSO_CONTEXT}}
-->
<link rel="stylesheet" href="../css/design_tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    background-color: var(--koine-cream);
    font-family: var(--font-sans);
    position: relative;
  }

  /* Fundo textura */
  .bg-paper {
    position: absolute; inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='80' height='80' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* Grid decorativo de fundo */
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(38,66,42,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,66,42,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  /* Layout */
  .layout {
    position: relative;
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    padding: 72px 80px 64px;
    z-index: 1;
  }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
  }
  .mode-badge {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--koine-white);
    background: var(--koine-primary);
    padding: 10px 24px;
    border-radius: var(--radius-pill);
  }
  .mode-badge--curiosidade { background: var(--koine-accent); }

  /* Título */
  .title {
    font-family: var(--font-serif);
    font-size: 42px; font-weight: 700;
    color: var(--koine-charcoal);
    line-height: 1.2;
    margin-bottom: 28px;
    max-width: 880px;
  }

  /* Corpo */
  .body-text {
    font-size: 19px; line-height: 1.70;
    color: var(--koine-charcoal-soft);
    margin-bottom: 36px;
    max-width: 880px;
  }

  /* Stats / Barras de dados */
  .stats-grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    margin-bottom: 32px;
  }
  .stat-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stat-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .stat-label {
    font-size: 16px; font-weight: 600;
    color: var(--koine-charcoal);
    opacity: 0.55;
    letter-spacing: 0.04em;
  }
  .stat-value {
    font-size: 36px; font-weight: 800;
    color: var(--koine-accent);
    font-variant-numeric: tabular-nums;
  }
  .stat-bar-bg {
    width: 100%;
    height: 20px;
    background: var(--koine-primary-08);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: var(--radius-pill);
  }
  .stat-bar-fill--1 { background: var(--koine-accent); }
  .stat-bar-fill--2 { background: var(--koine-primary); }
  .stat-bar-fill--3 { background: var(--koine-charcoal-soft); }

  /* Versículo mode */
  .verse-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--koine-primary-05);
    border-left: 4px solid var(--koine-accent);
    border-radius: 0 var(--radius-card) var(--radius-card) 0;
    padding: 48px 56px;
    margin-bottom: 32px;
  }
  .verse-greek {
    font-family: var(--font-greek);
    font-size: 36px; line-height: 1.5;
    color: var(--koine-primary);
    margin-bottom: 20px;
  }
  .verse-translation {
    font-family: var(--font-serif);
    font-size: 26px; line-height: 1.6;
    color: var(--koine-charcoal);
    font-style: italic;
    margin-bottom: 20px;
  }
  .verse-ref {
    font-size: 16px; font-weight: 600;
    color: var(--koine-accent);
    letter-spacing: 0.04em;
  }
  .verse-context {
    font-size: 17px; line-height: 1.7;
    color: var(--koine-charcoal-soft);
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--koine-primary-10);
  }

  /* Footer */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px;
    border-top: 1px solid var(--koine-primary-10);
  }
  .footer-brand {
    font-family: var(--font-greek);
    font-size: 70px; font-weight: 700;
    color: var(--koine-primary);
    opacity: 0.35;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="bg-paper"></div>
  <div class="bg-grid"></div>

  <div class="layout">
    <div class="header">
      <span class="mode-badge mode-badge--curiosidade">{{MODE_BADGE}}</span>
    </div>

    <div class="title">{{CURIOSIDADE_TITLE}}</div>
    <div class="body-text">{{CURIOSIDADE_BODY}}</div>

    <div class="stats-grid">
      <div class="stat-row">
        <div class="stat-header">
          <span class="stat-label">{{STAT_LABEL_1}}</span>
          <span class="stat-value">{{STAT_VALUE_1}}</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill stat-bar-fill--1" style="width: {{STAT_BAR_WIDTH_1}}%"></div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-header">
          <span class="stat-label">{{STAT_LABEL_2}}</span>
          <span class="stat-value">{{STAT_VALUE_2}}</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill stat-bar-fill--2" style="width: {{STAT_BAR_WIDTH_2}}%"></div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-header">
          <span class="stat-label">{{STAT_LABEL_3}}</span>
          <span class="stat-value">{{STAT_VALUE_3}}</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill stat-bar-fill--3" style="width: {{STAT_BAR_WIDTH_3}}%"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-brand">Κοινή</span>
    </div>
  </div>
</body>
</html>
